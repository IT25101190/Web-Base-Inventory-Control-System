# Server Configuration
server.port=8080
server.servlet.context-path=/

# MSSQL DataSource Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NovaMartInventoryDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Security Configuration (Shared with Node.js Auth Service)
jwt.secret=NovaMartSuperSecureSecretKeySharedAcrossServices2026!
jwt.expiration-ms=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.novamart.inventory=INFO
logging.level.org.springframework.security=WARN
